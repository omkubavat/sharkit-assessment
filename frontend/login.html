<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070D17">
  <title>Sign in · AskBoard</title>
  <meta name="description" content="Sign in to AskBoard to browse and post funding asks.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">

  <!-- Loaded synchronously (no defer) so the saved theme is applied before first paint. -->
  <script src="js/theme.js"></script>
</head>
<body class="page-auth">
  <header class="auth-top">
    <a class="brand" href="login.html" aria-label="AskBoard home">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17 10 11l3 3 6-8"/><path d="M14 6h5v5"/></svg>
      </span>
      <span class="brand-name">AskBoard</span>
    </a>

    <button class="icon-btn" type="button" data-theme-toggle aria-pressed="false" aria-label="Switch to light mode">
      <svg class="ic-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="ic-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>

  <main class="auth-main">
    <section class="auth-card glass" aria-labelledby="auth-title">
      <h1 id="auth-title" class="auth-title">Back your <span class="grad-text">next raise</span></h1>
      <p class="auth-sub">Sign in to see the live feed of founder asks and post your own.</p>

      <form id="login-form" class="auth-form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" class="input" type="email" inputmode="email"
                 autocomplete="username" placeholder="you@company.com" required>
          <p class="field-error" id="email-error" role="alert" hidden></p>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <input id="password" name="password" class="input" type="password"
                   autocomplete="current-password" placeholder="Enter your password" required>
            <button type="button" class="reveal" id="toggle-password" aria-pressed="false" aria-controls="password">Show</button>
          </div>
          <p class="field-error" id="password-error" role="alert" hidden></p>
        </div>

        <p class="form-error" id="form-error" role="alert" hidden></p>

        <button class="btn-primary" id="submit-btn" type="submit">Sign in</button>
      </form>

      <div class="demo-hint">
        <p>This is a demo with one seeded account.</p>
        <button type="button" class="link-btn" id="fill-demo">Fill in demo login</button>
      </div>
    </section>
  </main>

  <script src="js/auth.js"></script>
</body>
</html>
