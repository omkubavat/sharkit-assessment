<!DOCTYPE html>
<!-- data-requires-auth: auth.js redirects to login.html before anything paints if not signed in -->
<html lang="en" data-theme="dark" data-requires-auth>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070D17">
  <title>Live asks · AskBoard</title>
  <meta name="description" content="Browse live funding asks from founders and post your own.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">

  <!-- Synchronous on purpose: theme applies before first paint, auth guard runs before render. -->
  <script src="js/theme.js"></script>
  <script src="js/auth.js"></script>
</head>
<body class="page-feed">
  <header class="topbar">
    <a class="brand" href="index.html" aria-label="AskBoard home">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17 10 11l3 3 6-8"/><path d="M14 6h5v5"/></svg>
      </span>
      <span class="brand-name">AskBoard</span>
    </a>

    <div class="topbar-actions">
      <button class="icon-btn" type="button" data-theme-toggle aria-pressed="false" aria-label="Switch to light mode">
        <svg class="ic-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="ic-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <button class="btn-ghost" type="button" id="logout-btn">Sign out</button>
    </div>
  </header>

  <main class="feed-main">
    <section class="feed-head">
      <div>
        <h1 class="feed-title">Live asks from <span class="grad-text">founders</span></h1>
        <p class="feed-sub">Equity, loans and grants, posted by the people building the companies.</p>
      </div>
      <button class="btn-primary btn-inline" type="button" id="open-post">Post an Ask</button>
    </section>

    <div class="filters" id="filters" role="group" aria-label="Filter by funding type">
      <button type="button" class="pill" data-filter="All" aria-pressed="true">All</button>
      <button type="button" class="pill" data-filter="Equity" aria-pressed="false">Equity</button>
      <button type="button" class="pill" data-filter="Loan" aria-pressed="false">Loan</button>
      <button type="button" class="pill" data-filter="Grant" aria-pressed="false">Grant</button>
    </div>

    <p class="sr-only" id="feed-status" role="status" aria-live="polite"></p>

    <section class="feed-grid" id="feed" aria-busy="true" aria-label="Founder asks"></section>
    <div class="feed-message glass" id="feed-message" hidden></div>
  </main>

  <!-- Post an Ask -->
  <dialog class="sheet" id="post-dialog" aria-labelledby="post-title">
    <form class="sheet-body" id="post-form" novalidate>
      <div class="sheet-head">
        <h2 id="post-title">Post an Ask</h2>
        <button type="button" class="icon-btn sm" id="close-post" aria-label="Close">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>

      <div class="field">
        <label for="f-company">Company name</label>
        <input id="f-company" name="company_name" class="input" type="text" maxlength="60" autocomplete="organization" placeholder="Acme Agritech">
        <p class="field-error" data-error-for="company_name" hidden></p>
      </div>

      <div class="field">
        <label for="f-founder">Founder name</label>
        <input id="f-founder" name="founder_name" class="input" type="text" maxlength="60" autocomplete="name" placeholder="Priya Sharma">
        <p class="field-error" data-error-for="founder_name" hidden></p>
      </div>

      <div class="field">
        <label for="f-sector">Sector</label>
        <select id="f-sector" name="sector" class="input"></select>
        <p class="field-error" data-error-for="sector" hidden></p>
      </div>

      <div class="field">
        <div class="label-row">
          <label for="f-pitch">One-line pitch</label>
          <span class="counter" id="pitch-count" aria-hidden="true">0/140</span>
        </div>
        <input id="f-pitch" name="pitch" class="input" type="text" maxlength="140" placeholder="Cold storage for small farms, paid per crate">
        <p class="field-error" data-error-for="pitch" hidden></p>
      </div>

      <fieldset class="field seg">
        <legend>Funding type</legend>
        <div class="seg-row">
          <label class="seg-opt"><input type="radio" name="funding_type" value="Equity" checked><span>Equity</span></label>
          <label class="seg-opt"><input type="radio" name="funding_type" value="Loan"><span>Loan</span></label>
          <label class="seg-opt"><input type="radio" name="funding_type" value="Grant"><span>Grant</span></label>
        </div>
        <p class="field-error" data-error-for="funding_type" hidden></p>
      </fieldset>

      <div class="field">
        <label for="f-amount">Amount sought (Rs)</label>
        <input id="f-amount" name="amount_inr" class="input" type="text" inputmode="numeric" autocomplete="off" placeholder="2500000">
        <p class="helper" id="amount-help">Between Rs 10,000 and Rs 100 crore.</p>
        <p class="field-error" data-error-for="amount_inr" hidden></p>
      </div>

      <div class="field" id="equity-field">
        <label for="f-equity">Equity offered (%)</label>
        <input id="f-equity" name="equity_percent" class="input" type="text" inputmode="decimal" autocomplete="off" placeholder="8">
        <p class="field-error" data-error-for="equity_percent" hidden></p>
      </div>

      <p class="form-error" id="post-error" role="alert" hidden></p>

      <div class="sheet-actions">
        <button type="button" class="btn-ghost" id="cancel-post">Cancel</button>
        <button type="submit" class="btn-primary btn-inline" id="submit-post">Post ask</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="js/deals.js"></script>
</body>
</html>
